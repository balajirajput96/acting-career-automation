name: Toolkit Health Check

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 Asia/Kolkata (02:30 UTC).
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  validate-toolkit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python scripts
        run: python -m compileall -q scripts

      - name: Validate lead tracker schema
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          expected = [
              "id", "date_found", "source", "project", "role",
              "contact_type", "contact", "status", "notes",
          ]
          with Path("data/casting_leads.csv").open(newline="", encoding="utf-8") as handle:
              header = next(csv.reader(handle), [])
          if header != expected:
              raise SystemExit(f"Unexpected CSV header: {header!r}")
          print("Lead tracker schema is valid.")
          PY

      - name: Publish safe job summary
        run: |
          {
            echo "## Daily Toolkit Health Check"
            echo "Python scripts compiled and the local lead-tracker schema was validated."
            echo "No messages, applications, payments, or external submissions were performed."
          } >> "$GITHUB_STEP_SUMMARY"
