name: Toolkit Health Check

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 Asia/Kolkata (02:30 UTC).
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  validate-toolkit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python scripts
        run: python -m compileall -q scripts

      - name: Validate toolkit inputs
        run: python scripts/validate_toolkit.py

      - name: Publish safe job summary
        run: |
          {
            echo "## Daily Toolkit Health Check"
            echo "Python scripts compiled and the local lead-tracker schema was validated."
            echo "No messages, applications, payments, or external submissions were performed."
          } >> "$GITHUB_STEP_SUMMARY"
